name: Refresh profile activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out profile source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate public repository statistics
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/generate_stats.py

      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/assets/snake-light.svg?palette=github-light&color_snake=#0969da
            dist/assets/snake-dark.svg?palette=github-dark&color_snake=#79c0ff

      - name: Pass generated assets to publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-assets
          path: dist/assets/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download generated assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: profile-assets
          path: ${{ runner.temp }}/profile-assets

      - name: Publish SVGs to output branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git switch --track origin/output
          else
            git switch --orphan output
          fi
          mkdir -p assets
          for asset in stats-light stats-dark snake-light snake-dark; do
            test -s "$RUNNER_TEMP/profile-assets/$asset.svg"
            cp "$RUNNER_TEMP/profile-assets/$asset.svg" "assets/$asset.svg"
          done
          git add -- assets/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile activity assets'
          # Authenticate only the push; never persist or print the token.
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:output
